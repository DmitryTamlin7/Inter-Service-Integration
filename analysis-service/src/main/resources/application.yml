server:
  port: 8082

spring:
  application:
    name: analysis-com.integral.service

  datasource:
    url: jdbc:postgresql://postgres:5432/storing_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}


minio:
  url: http://minio:9000
  accessKey: ${MINIO_ROOT_USER}
  secretKey: ${MINIO_ROOT_PASSWORD}
  bucketName: student-works

app:
  rabbit:
    queue: works-queue
    exchange: works-exchange
    routing-key: works.routing.key
  external-api:
    word-cloud-url: https://quickchart.io/wordcloud

external-api:
  word-cloud-url: https://quickchart.io/wordcloud

springdoc:
  swagger-ui:
    servers-url: http://localhost:8080
  api-docs:
    path: /v3/api-docs
    use-management-port: false