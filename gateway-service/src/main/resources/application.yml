server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Маршрут для загрузки работ
        - id: storing-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/works/**

        # Маршрут для получения отчетов
        - id: analysis-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/reports/**