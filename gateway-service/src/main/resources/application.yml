server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        # Маршрут для загрузки работ
        - id: storing-service
          uri: http://localhost:8081
          predicates:
            # Какие пути перехватывать. Если запрос начинается так, то он пойдет на 8081 порт
            - Path=/upload, /works/**, /swagger-ui/**, /v3/api-docs/**

        # Маршрут для получения отчетов
        - id: analysis-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/reports/**

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB       # Максимальный размер одного файла
      max-request-size: 25MB
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

